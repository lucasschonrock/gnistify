<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#3a1d0c"/>
      <stop offset="0.55" stop-color="#1a0f0a"/>
      <stop offset="1" stop-color="#0b0807"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.75"/>
      <stop offset="0.4" stop-color="#ff7a1a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff5a00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6d0"/>
      <stop offset="0.5" stop-color="#ffd25a"/>
      <stop offset="1" stop-color="#ff8a1f"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#fff3c4" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffd25a" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="400" height="400" rx="56" fill="url(#bg)"/>
  <rect x="6" y="6" width="388" height="388" rx="50" fill="none" stroke="#ff8a1f" stroke-opacity="0.35" stroke-width="3"/>

  <!-- glow -->
  <circle cx="200" cy="190" r="170" fill="url(#glow)"/>

  <g transform="translate(200 190)">
    <!-- diagonal short rays -->
    <g transform="rotate(45)" fill="url(#spark)" opacity="0.85">
      <path d="M0,-92 C7,-30 30,-7 92,0 C30,7 7,30 0,92 C-7,30 -30,7 -92,0 C-30,-7 -7,-30 0,-92 Z"/>
    </g>
    <!-- main four-point spark, blurred copy for bloom -->
    <path d="M0,-150 C11,-42 42,-11 150,0 C42,11 11,42 0,150 C-11,42 -42,11 -150,0 C-42,-11 -11,-42 0,-150 Z"
          fill="#ffb347" filter="url(#blur)" opacity="0.8"/>
    <path d="M0,-150 C11,-42 42,-11 150,0 C42,11 11,42 0,150 C-11,42 -42,11 -150,0 C-42,-11 -11,-42 0,-150 Z"
          fill="url(#spark)"/>
    <circle r="38" fill="url(#core)"/>
  </g>

  <!-- flying embers -->
  <g fill="#ffd25a">
    <circle cx="318" cy="96" r="7"/>
    <circle cx="342" cy="66" r="4" opacity="0.8"/>
    <circle cx="90" cy="292" r="6" opacity="0.9"/>
    <circle cx="66" cy="320" r="3.5" opacity="0.7"/>
    <circle cx="312" cy="300" r="4" opacity="0.75"/>
    <circle cx="86" cy="88" r="3.5" opacity="0.7"/>
  </g>

  <text x="200" y="372" text-anchor="middle" font-family="Avenir Next, Helvetica Neue, Arial" font-weight="800"
        font-size="44" letter-spacing="4" fill="#fff3d6">GNISTIFY</text>
</svg>
