# Builds Gnistify.zip and uploads it to CurseForge + GitHub Releases.
#
#  - Every push to main that changes the addon makes a new patch release
#    (v1.0.0 -> v1.0.1 -> ...). The "tag" job creates the tag and then starts
#    this workflow again on that tag, where the "package" job builds and
#    uploads it. (The packager refuses to build a tag from a branch run, and a
#    tag pushed with GITHUB_TOKEN doesn't trigger workflows by itself, so the
#    run on the tag is started with workflow_dispatch.)
#  - Pushing your own tag (e.g. v1.1.0) releases that version instead, so
#    bigger version jumps are still possible.
#  - Pushes that only touch docs, art or this workflow don't release.
#    Add [skip ci] to a commit message to skip a release on purpose.
#  - "Run workflow" on main in the Actions tab releases the next patch version
#    by hand.
#
# Needs (GitHub repo -> Settings -> Secrets and variables -> Actions):
#   Secret   CF_API_KEY       - CurseForge API token
#   Variable CF_GAME_VERSION  - optional, CurseForge game version (default 1.60.1)
# and "## X-Curse-Project-ID: <id>" in Gnistify.toc.

name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:          # only applies to branch pushes
      - "README.md"
      - "CLAUDE.md"
      - "art/**"
      - ".github/**"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: write   # create tags and the GitHub release
  actions: write    # start this workflow on the new tag

jobs:
  tag:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    concurrency:
      group: release-tag
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need all tags to work out the next version

      - name: Tag next version and start the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git describe --exact-match --tags HEAD >/dev/null 2>&1; then
            echo "HEAD is already tagged ($(git describe --exact-match --tags HEAD)), skipping"
            exit 0
          fi
          last=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          last=${last:-v0.0.0}
          IFS=. read -r major minor patch <<< "${last#v}"
          next="v${major}.${minor}.$((patch + 1))"
          echo "Releasing $next (previous: $last)"
          git tag "$next"
          git push origin "$next"
          gh workflow run release.yml --ref "$next"

  package:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    concurrency:
      group: release-package
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the packager builds the changelog from history

      - uses: BigWigsMods/packager@v2
        with:
          # WoW Forever's own interface number (16001) isn't a CurseForge game
          # version, so tell CurseForge which game version to list.
          args: -g ${{ vars.CF_GAME_VERSION || '1.60.1' }}
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
